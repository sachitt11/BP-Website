<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BP Club | Application Submitted</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            text-align: center;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(56,189,248,.30),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(129,140,248,.30),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #020617,
                    #172554 55%,
                    #312e81
                );
        }

        .card {
            width: min(600px, 100%);

            padding: 50px 35px;

            border-radius: 28px;

            background: rgba(255,255,255,.10);

            border: 1px solid rgba(255,255,255,.18);

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0,0,0,.30);
        }

        .check {
            width: 78px;
            height: 78px;

            margin: 0 auto 24px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #818cf8
                );

            font-size: 2.4rem;

            font-weight: bold;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 3.5rem);

            margin-bottom: 15px;
        }

        p {
            color: #dbeafe;

            font-size: 1.1rem;

            line-height: 1.7;

            margin-bottom: 28px;
        }

        a {
            display: inline-block;

            padding: 13px 25px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #818cf8
                );

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: .3s;
        }

        a:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="check">
            ✓
        </div>

        <h1>
            Application Submitted!
        </h1>

        <p>
            Thanks for your interest in BP Club.
            Your application has been sent successfully.
            We'll review it and get back to you using
            the email you provided.
        </p>

        <a href="/">
            Back to BP Club
        </a>

    </main>

</body>
</html>
